[package]
name = "bucks-core"
version = "0.1.0"
edition = "2021"
description = "Bucks identity core: self-certifying Bucks ID, identity log, device delegation"
license = "MIT"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "std"] }
blake3 = "1"
bs58 = "0.5"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
