<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    color: #e8e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    padding: 40px 48px;
    min-height: 100%;
  }
  .logo {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .tagline {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7b7baa;
    margin-bottom: 36px;
  }
  .divider {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, #6c63ff, #00d4ff);
    margin-bottom: 28px;
    border-radius: 1px;
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: #b0b0cc;
    max-width: 360px;
  }
  .highlight {
    color: #c8c8f0;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="logo">Bucks</div>
  <div class="tagline">Soul Engine &middot; Web3 Browser &middot; AI Runtime</div>
  <div class="divider"></div>
  <p>
    This will install <span class="highlight">Bucks</span> on your Mac.
    The installer will download Bucks from the decentralized web and set it
    up automatically — no manual steps required.
  </p>
  <br>
  <p>
    Click <span class="highlight">Continue</span> to proceed.
  </p>
</body>
</html>
