<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bucks Companion HUD</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-glass: rgba(18, 19, 26, 0.90);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(255, 255, 255, 0.28);
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.25);
      --text-main: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.55);
    }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Outer Glass Shell ── */
    #shell {
      width: 100%;
      height: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(50px) saturate(190%) brightness(1.08);
      -webkit-backdrop-filter: blur(50px) saturate(190%) brightness(1.08);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 0 0.5px rgba(255,255,255,0.08) inset;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Top Window Bar (Draggable) ── */
    #hud-header {
      height: 44px;
      padding: 0 12px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      -webkit-app-region: drag;
      user-select: none;
      flex-shrink: 0;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.85);
    }

    .hud-brand svg {
      color: #9d7aff;
      filter: drop-shadow(0 0 8px rgba(157, 122, 255, 0.5));
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      -webkit-app-region: no-drag;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.55);
      border-radius: 6px;
      padding: 4px 7px;
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .hud-btn.active {
      background: rgba(124, 92, 255, 0.22);
      border-color: rgba(124, 92, 255, 0.45);
      color: #bfaaff;
    }

    /* ── Scrollable Conversation History ── */
    #hud-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-app-region: no-drag;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    #hud-messages::-webkit-scrollbar { width: 5px; }
    #hud-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* Message Bubbles */
    .msg-user {
      align-self: flex-end;
      max-width: 85%;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.35), rgba(76, 52, 185, 0.45));
      border: 1px solid rgba(124, 92, 255, 0.35);
      color: #fff;
      padding: 9px 14px;
      border-radius: 14px 14px 2px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      word-break: break-word;
    }

    .msg-agent {
      align-self: flex-start;
      width: 100%;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px 14px 14px 14px;
      padding: 12px 15px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-main);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    /* Markdown Elements inside Messages */
    .msg-agent .nx-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
    }
    .msg-agent .nx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }
    .msg-agent .nx-table th {
      background: rgba(255, 255, 255, 0.07);
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: #d1d5db;
    }
    .msg-agent .nx-table td {
      padding: 7px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #e5e7eb;
    }

    .msg-agent .nx-code-block {
      margin: 10px 0;
      background: #090a0f;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
    }
    .msg-agent .nx-code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }
    .msg-agent .nx-code-copy {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .msg-agent .nx-code-copy:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .msg-agent .nx-code-pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .msg-agent .nx-inline-code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #d8b4fe;
    }
    .msg-agent .nx-blockquote {
      border-left: 3px solid #7c5cff;
      padding-left: 10px;
      margin: 8px 0;
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
    }

    /* ── Follow-up Chips Bar ── */
    #chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 14px;
      -webkit-app-region: no-drag;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(0, 0, 0, 0.15);
    }
    .followup-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .followup-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* ── Bottom Composer ── */
    #hud-composer {
      padding: 10px 14px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    #hud-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13.5px;
      color: #fff;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #hud-input:focus {
      border-color: rgba(124, 92, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }
    #hud-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    #btn-send {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #7c5cff, #5733d8);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
    }
    #btn-send:hover {
      opacity: 0.92;
      transform: scale(1.02);
    }
    #btn-send:active {
      transform: scale(0.96);
    }

    /* Streaming Cursor */
    .streaming-text::after {
      content: '▋';
      display: inline-block;
      color: #9d7aff;
      animation: blink 0.9s step-end infinite;
      font-size: 12px;
      margin-left: 2px;
    }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
  </style>
</head>
<body>
  <div id="shell">
    <!-- Header with window controls, pin, mode switcher, new chat, minimize -->
    <div id="hud-header">
      <div class="hud-brand">
        <img src="brand/dist/icons/32x32.png" width="16" height="16" style="border-radius:3.5px; vertical-align:middle; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));" alt="" />
        <span style="font-family:'Instrument Sans',system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:-0.03em;">Bucks Companion</span>
      </div>

      <div class="hud-controls">
        <!-- Always-On-Top Pin -->
        <button class="hud-btn" id="btn-pin" title="Pin HUD on top of other apps">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-2l-3-3V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v7l-3 3v2z"/></svg>
          <span id="pin-label">Pin</span>
        </button>

        <!-- Mode Presets -->
        <button class="hud-btn" id="btn-mode-card" title="Card Mode">Card</button>
        <button class="hud-btn" id="btn-mode-dock" title="Dock to Side">Dock</button>

        <!-- New Chat (Cmd+N) -->
        <button class="hud-btn" id="btn-new-chat" title="Start new conversation (Cmd+N)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New</span>
        </button>

        <!-- Open in Full Bucks Browser -->
        <button class="hud-btn" id="btn-open-browser" title="Expand into Bucks Browser">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>

        <!-- Minimize -->
        <button class="hud-btn" id="btn-minimize" title="Minimize (Esc)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Scrollable Conversation Thread -->
    <div id="hud-messages">
      <div class="msg-agent" style="color: rgba(255,255,255,0.7); font-size:12.5px;">
        ✦ <strong>Bucks Companion</strong> is ready. Ask any question, generate code, analyze data, or co-browse alongside any window.
      </div>
    </div>

    <!-- Dynamic Follow-Up Chips -->
    <div id="chips-container" style="display: none;"></div>

    <!-- Composer Bar -->
    <div id="hud-composer">
      <input type="text" id="hud-input" placeholder="Ask anything or continue conversation…" autocomplete="off" spellcheck="false" />
      <button id="btn-send" title="Send (Enter)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="ephemeral-renderer.js"></script>
</body>
</html>
