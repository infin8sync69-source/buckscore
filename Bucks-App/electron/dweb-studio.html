<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bucks AI DWeb Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Sora:wght@400..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

    :root {
      --bg: radial-gradient(circle at 50% 120%, #161922, #090a0f);
      --panel-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.45);
      --accent: var(--accent);
      --accent-glow: var(--accent-soft);
      --font-sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Monaco, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Studio Layout */
    .studio-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: transparent;
    }

    /* Left Sidebar: Controls & Prompting */
    .sidebar {
      width: 420px;
      border-right: 1px solid var(--border);
      background: rgba(20, 21, 28, 0.35);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dim);
      font-weight: 700;
    }

    select, textarea, input {
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }
    select:focus, textarea:focus, input:focus {
      border-color: var(--accent-ring);
      box-shadow: 0 0 10px var(--accent-soft);
    }
    textarea {
      resize: none;
      height: 120px;
      line-height: 1.5;
    }

    button.btn {
      background: #fff;
      color: #0b0c10;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }
    button.btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.12);
    }
    button.btn:active {
      transform: translateY(0);
    }
    button.btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
    }
    button.btn.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-ring);
    }

    /* Live Output / Publication Box */
    .status-panel {
      padding: 16px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-soft);
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .status-header {
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }
    .cid-box {
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
      border: 1px solid var(--border);
      user-select: text;
    }

    .published-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
    }
    .published-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .published-item a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .published-item a:hover {
      text-decoration: underline;
    }

    /* Right Display Pane: IFrame / Source Editor */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: transparent;
      padding: 20px;
      gap: 16px;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
      gap: 16px;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab:hover {
      color: #fff;
    }
    .tab.active {
      color: #fff;
      border-color: var(--accent);
    }

    .content-area {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(10, 11, 15, 0.8);
      backdrop-filter: blur(20px);
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }
    iframe.dark {
      background: #000;
    }

    textarea.code-editor {
      width: 100%;
      height: 100%;
      border: none;
      background: #0d0e12;
      color: #e2e4f0;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 24px;
      resize: none;
      display: none;
      line-height: 1.6;
    }

    /* Loading Spinner */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 11, 15, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="studio-container">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      <div class="header">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <h1>DWeb Creator Studio</h1>
      </div>

      <div class="form-group">
        <label for="templateSelect">Choose Layout Template</label>
        <select id="templateSelect">
          <option value="portfolio">Personal Portfolio Website</option>
          <option value="landing">Product Landing Page</option>
          <option value="dashboard">SaaS Analytics Dashboard</option>
          <option value="store">Digital Assets E-Commerce</option>
          <option value="blog">Minimalist Reading Blog</option>
        </select>
      </div>

      <div class="form-group">
        <label for="promptInput">Prompt your AI Creator</label>
        <textarea id="promptInput" placeholder="Describe the design, colors, features, and content you want. E.g., 'A gorgeous cosmic-themed photographer portfolio with an image gallery and light/dark theme toggle...'"></textarea>
      </div>

      <button id="btnGenerate" class="btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        Generate with AI
      </button>

      <!-- Code editor modification trigger -->
      <div id="publishContainer" style="display:none; flex-direction:column; gap:12px;">
        <div class="form-group">
          <label for="siteNameInput">Website Name / Folder Name</label>
          <input type="text" id="siteNameInput" value="cosmic-portfolio">
        </div>
        <button id="btnPublish" class="btn" style="background: linear-gradient(135deg, var(--accent) 0%, var(--accent) 100%); color:#fff;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          Publish to IPFS
        </button>
      </div>

      <!-- Live Publication Status -->
      <div class="status-panel" id="statusPanel">
        <div class="status-header">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          Published Successfully!
        </div>
        <div style="font-size:11px; color:var(--dim);">Your files are co-hosted on IPFS:</div>
        <div class="cid-box" id="cidBox">Qm...</div>
        <button id="btnOpenLink" class="btn secondary">
          Open in New Tab
        </button>
      </div>

      <!-- Published List -->
      <div class="form-group" style="margin-top:auto;">
        <label>My Published Sites</label>
        <div class="published-list" id="publishedList">
          <p style="font-size:12px; color:var(--dim); text-align:center; padding:20px 0;">No pages published yet.</p>
        </div>
      </div>
    </div>

    <!-- MAIN DISPLAY VIEWER -->
    <div class="main-view">
      <div class="tab-bar">
        <div class="tab active" id="tabPreview">Live View</div>
        <div class="tab" id="tabCode">Source Code</div>
      </div>

      <div class="content-area">
        <!-- Live Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div style="font-size:14px; font-weight:600;" id="loadingText">Generating page...</div>
        </div>

        <iframe id="previewIframe" src="about:blank"></iframe>
        <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
      </div>
    </div>

  </div>

  <script src="dweb-studio-renderer.js"></script>
</body>
</html>
