# 3-node IPFS cluster (kubo + ipfs-cluster per node).
# Generate a shared secret first:
#   export CLUSTER_SECRET=$(od -vN 32 -An -tx1 /dev/urandom | tr -d ' \n')
# Then: docker compose up -d
# Cluster REST API: localhost:9094 · Kubo API: localhost:5001 · Gateway: localhost:8080

x-ipfs: &ipfs
  image: ipfs/kubo:latest
  restart: unless-stopped

x-cluster: &cluster
  image: ipfs/ipfs-cluster:latest
  restart: unless-stopped

services:
  ipfs0:
    <<: *ipfs
    volumes: [ipfs0:/data/ipfs]
    ports:
      - "5001:5001"   # kubo API (node 0 only)
      - "8080:8080"   # gateway (node 0 only)

  cluster0:
    <<: *cluster
    depends_on: [ipfs0]
    environment:
      CLUSTER_PEERNAME: cluster0
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs0/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes: [cluster0:/data/ipfs-cluster]
    ports:
      - "9094:9094"   # cluster REST API (node 0 only)

  ipfs1:
    <<: *ipfs
    volumes: [ipfs1:/data/ipfs]

  cluster1:
    <<: *cluster
    depends_on: [ipfs1, cluster0]
    environment:
      CLUSTER_PEERNAME: cluster1
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs1/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes: [cluster1:/data/ipfs-cluster]

  ipfs2:
    <<: *ipfs
    volumes: [ipfs2:/data/ipfs]

  cluster2:
    <<: *cluster
    depends_on: [ipfs2, cluster0]
    environment:
      CLUSTER_PEERNAME: cluster2
      CLUSTER_SECRET: ${CLUSTER_SECRET}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs2/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: "*"
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes: [cluster2:/data/ipfs-cluster]

volumes:
  ipfs0: {}
  ipfs1: {}
  ipfs2: {}
  cluster0: {}
  cluster1: {}
  cluster2: {}
